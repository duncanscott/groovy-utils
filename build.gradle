plugins {
    id 'idea'
}

apply from: "${rootProject.projectDir}/gradle/scripts/tag.gradle"

repositories {
    mavenCentral()
}

def javaProjects() {
    subprojects.findAll { new File(it.projectDir, 'src').directory }
}

configure(javaProjects()) {
    apply plugin: 'groovy'
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        implementation group: 'org.slf4j', name: 'slf4j-api', version: sl4jVersion
        testRuntimeOnly group: 'ch.qos.logback', name: 'logback-classic', version: logbackVersion
        testRuntimeOnly group: 'ch.qos.logback', name: 'logback-core', version: logbackVersion
    }

    testing {
        suites {
            test {
                useSpock(spockVersion)
            }
        }
    }

    tasks.register('sourcesJar', Jar) {
        archiveClassifier = 'sources'
        from sourceSets.main.allSource
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
                artifact sourcesJar
                artifact(file("$rootDir/gradle.properties"))
                pom {
                    // The additional properties artifact must not change JAR packaging.
                    packaging = 'jar'
                }
            }
        }

        repositories {
            // GitLab supplies the destination and job token during CI builds.
            // Local builds do not require publishing credentials.
            if (System.getenv('CI_API_V4_URL') && System.getenv('CI_PROJECT_ID')) {
                maven {
                    name = 'GitLab'
                    url = "${System.getenv('CI_API_V4_URL')}/projects/${System.getenv('CI_PROJECT_ID')}/packages/maven"
                    credentials(HttpHeaderCredentials) {
                        name = 'Job-Token'
                        value = System.getenv('CI_JOB_TOKEN')
                    }
                    authentication {
                        header(HttpHeaderAuthentication)
                    }
                }
            }
        }
    }
}
